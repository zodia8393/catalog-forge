server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8100 http://127.0.0.1:8100; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:;" always;
}
